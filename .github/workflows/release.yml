name: Release

# Trusted Publishing: no PyPI token stored anywhere. Requires a one-time
# PyPI-side setup: pypi.org -> account -> Publishing -> add publisher
# (project "tailor", owner XBR-1111, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write  # create the GitHub Release from the changelog
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYV="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$TAG" != "$PYV" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $PYV — bump pyproject.toml and CHANGELOG first"
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside=1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "tailor $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
