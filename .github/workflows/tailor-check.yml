name: tailor check (reusable)

# Reusable workflow: gate a robot dataset in YOUR CI with one line.
#
#   jobs:
#     check-dataset:
#       uses: XBR-1111/tailor/.github/workflows/tailor-check.yml@v0.14.1
#       with:
#         dataset: lerobot/unitreeh1_fold_clothes
#
# Verdict maps to the job result (rejected = red), the markdown report is
# uploaded as an artifact, and `tailor check` never writes to your dataset.
on:
  workflow_call:
    inputs:
      dataset:
        description: "Local path (with your repo checked out), a .zip, or a HF repo id (org/name)"
        required: true
        type: string
      full:
        description: "Download the whole HF dataset (--full) instead of meta-only pre-check"
        required: false
        default: false
        type: boolean
      fail-on-warn:
        description: "Exit non-zero on WARN findings too (strict gate)"
        required: false
        default: false
        type: boolean
      extra-args:
        description: "Shell-quoted arguments to `tailor check` (e.g. '--profile my.yaml')"
        required: false
        default: ""
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install lerobot-tailor==0.14.1
      - name: tailor check
        env:
          TAILOR_DATASET: ${{ inputs.dataset }}
          TAILOR_FULL: ${{ inputs.full }}
          TAILOR_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
          TAILOR_EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          python - <<'PY'
          import os
          import shlex
          import subprocess

          args = ["tailor", "check"]
          if os.environ["TAILOR_FULL"] == "true":
              args.append("--full")
          if os.environ["TAILOR_FAIL_ON_WARN"] == "true":
              args.append("--fail-on-warn")
          args.extend(shlex.split(os.environ["TAILOR_EXTRA_ARGS"]))
          args.extend(["--markdown", "tailor-report.md", "--", os.environ["TAILOR_DATASET"]])
          raise SystemExit(subprocess.call(args))
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-report
          path: tailor-report.md
          if-no-files-found: ignore
