[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailor"
version = "0.4.0"
description = "Refine distributed robot datasets into training-ready data: acceptance checks, episode-level filtering, deterministic cleaning, provenance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["lerobot", "robotics", "dataset", "data-quality", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.26",
    "typer>=0.12",
    "pyyaml>=6",
    "av>=12",
    "rich>=13",
    "pyarrow>=15",
    "pandas>=2",
]

[project.optional-dependencies]
lerobot = ["lerobot[dataset]>=0.6"]

[project.urls]
Homepage = "https://github.com/XBR-1111/tailor"

[project.scripts]
tailor = "tailor.cli:app"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# dev deps as a PEP 735 group (uv sync installs it), not an extra — pip -e ".[dev]" cannot see it
[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.14",
    "pandas-stubs>=2",
    "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tailor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: typer/fastapi idiom — Argument()/Option() as parameter defaults is the documented pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["tailor"]
branch = true

[tool.coverage.report]
# baseline 2026-10: 79% (cli's filter command needs lerobot, covered by
# manual end-to-end runs, not CI). tighten as the suite grows
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["av.*", "lerobot.*", "pyarrow.*"]
ignore_missing_imports = true
