[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailor"
version = "0.1.0"
description = "Refine distributed robot datasets into training-ready data: acceptance checks, episode-level filtering, deterministic cleaning, provenance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["lerobot", "robotics", "dataset", "data-quality", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "av>=12",
    "rich>=13",
    "pyarrow>=15",
    "pandas>=2",
]

[project.optional-dependencies]
lerobot = ["lerobot[dataset]>=0.6"]

[project.urls]
Homepage = "https://github.com/XBR-1111/tailor"

[project.scripts]
tailor = "tailor.cli:app"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# dev deps as a PEP 735 group (uv sync installs it), not an extra — pip -e ".[dev]" cannot see it
[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tailor"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: typer/fastapi idiom — Argument()/Option() as parameter defaults is the documented pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
